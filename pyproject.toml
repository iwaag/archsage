[project]
name = "archsage"
version = "0.1.0"
description = "archsage: the knowledge council — one agent, many sages"
requires-python = ">=3.11"
dependencies = ["pyagag"]

[project.scripts]
archsage-zulip-listener = "archsage.listener:main"
archsage = "archsage.cli:main"
sagetree = "archsage.sagetree:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archsage"]

[tool.uv.sources]
pyagag = { git = "https://github.com/iwaag/pyagag.git", branch = "main" }
