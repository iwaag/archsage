# archsage's agent configuration (ag.agent-config.v2).
#
# Two kinds of run, two profiles, on purpose. `archsage` is the frontier
# model: it designs research, judges what knowledge is missing and can
# inspect every sage's tree, so it is called sparingly. `sage` is the shared
# execution profile of every logical sage: one bounded reader over one
# knowledge tree, on the ordinary model. A sage differs from another sage
# only by its domain guide and its tree, never by its profile.
#
# Per-machine backend choice belongs in the ignored `.local/agents.local.toml`
# overlay (`[roles.archsage] profile = "sonnet"` moves the council itself to
# the cheaper model without touching this file).
schema = "ag.agent-config.v2"
project = "archsage"

[models."anthropic/claude-sonnet-5"]

[models."anthropic/claude-fable-5-1"]

[profiles.sonnet]
harness = "claude_code"
model = "anthropic/claude-sonnet-5"

# The frontier profile (argue p1 step 2). Both `anthropic/claude-opus-5` and
# `anthropic/claude-fable-5-1` answered through the claude CLI on this host
# on 2026-09-16; Fable 5.1 is the most capable one available and is what
# research design and difficult synthesis run on.
[profiles.frontier]
harness = "claude_code"
model = "anthropic/claude-fable-5-1"

[profiles.stub]
harness = "fake"
model = "anthropic/claude-sonnet-5"

# archsage itself: research design, synthesis, the council's own answers.
# Broad access is explicit here: it reads every sage's tree directly, asks a
# sage in-process (`archsage ask`), and defines a new sage and its guide
# (`archsage sage add`). `Write`/`Edit` are for the guides it writes under
# `sages/`; the tool `sagetree` is the same bounded reader the sages use.
[roles.archsage]
profile = "frontier"
requires = []
allowed_tools = "Read,Write,Edit,Glob,Grep,Bash(archsage:*),Bash(sagetree:*)"

# One logical sage's run. The grant is the bounded reader only: `sagetree`
# reads, greps and lists inside the tree named by SAGETREE_ROOT and refuses
# every path outside it, and there is no Read/Glob/Grep tool to reach past
# it. That is the boundary this experiment offers (see README); a compound
# shell command is the known way around a claude_code Bash grant.
[roles.sage]
profile = "sonnet"
requires = []
allowed_tools = "Bash(sagetree:*)"

# The skeleton's entrance role name; archsage answers its own channel with
# `archsage`, so this only has to exist for the generated scaffolding.
[roles.front]
profile = "frontier"
requires = []
allowed_tools = "Read,Glob,Grep,Bash(archsage:*),Bash(sagetree:*)"
